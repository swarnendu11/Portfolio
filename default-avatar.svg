<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111c34"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d4d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24365d"/>
      <stop offset="100%" stop-color="#0f1a30"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d99b70"/>
      <stop offset="100%" stop-color="#bf7f52"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="60%" stop-color="#141721"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="glassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="220" r="210" fill="url(#glowGrad)"/>

  <!-- Body / Navy Blazer Suit -->
  <path d="M70 512 C70 410, 140 375, 205 365 L256 420 L307 365 C372 375, 442 410, 442 512 Z" fill="url(#suitGrad)"/>

  <!-- White Dress Shirt -->
  <polygon points="256,335 220,430 256,485 292,430" fill="#f8fafc"/>
  <polygon points="256,365 240,430 256,480 272,430" fill="#e2e8f0"/>

  <!-- Suit Lapels -->
  <path d="M165 375 L225 470 L248 420 L205 365 Z" fill="url(#lapelGrad)"/>
  <path d="M347 375 L287 470 L264 420 L307 365 Z" fill="url(#lapelGrad)"/>

  <!-- Neck -->
  <path d="M225 285 L225 350 C225 368, 287 368, 287 350 L287 285 Z" fill="url(#skinGrad)"/>
  <!-- Neck shadow -->
  <path d="M225 285 Q256 315 287 285 L287 305 Q256 335 225 305 Z" fill="#000000" opacity="0.18"/>

  <!-- Head Base & Jaw -->
  <path d="M190 200 C190 295, 220 315, 256 315 C292 315, 322 295, 322 200 C322 135, 292 110, 256 110 C220 110, 190 135, 190 200 Z" fill="url(#skinGrad)"/>

  <!-- Neat Short Beard / Stubble Outline -->
  <path d="M194 235 C196 295, 222 318, 256 318 C290 318, 316 295, 318 235 C318 250, 314 275, 305 292 C290 312, 275 315, 256 315 C237 315, 222 312, 207 292 C198 275, 194 250, 194 235 Z" fill="#181c24" opacity="0.85"/>
  <!-- Moustache -->
  <path d="M236 270 Q256 265 276 270 Q256 277 236 270 Z" fill="#181c24" opacity="0.9"/>
  <!-- Lips -->
  <path d="M242 278 Q256 283 270 278 Q256 288 242 278 Z" fill="#a86045"/>

  <!-- Ears -->
  <path d="M184 195 C180 185, 178 225, 190 235 Z" fill="#c9855b"/>
  <path d="M328 195 C332 185, 334 225, 322 235 Z" fill="#c9855b"/>

  <!-- Modern Hair Pompadour Styled -->
  <path d="M182 175 C176 130, 205 78, 260 72 C305 67, 340 100, 332 165 C325 155, 320 145, 312 142 C295 136, 235 130, 205 160 C195 170, 188 175, 182 175 Z" fill="url(#hairGrad)"/>
  <path d="M188 170 C195 125, 230 85, 268 80 C290 77, 318 85, 325 110 C305 95, 275 92, 245 105 C220 115, 200 140, 188 170 Z" fill="#3a4050" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M208 175 Q225 168 242 174" stroke="#161922" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M270 174 Q287 168 304 175" stroke="#161922" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="225" cy="192" rx="9" ry="6" fill="#ffffff"/>
  <circle cx="225" cy="192" r="5" fill="#1e222d"/>
  <circle cx="227" cy="190" r="1.8" fill="#ffffff"/>

  <ellipse cx="287" cy="192" rx="9" ry="6" fill="#ffffff"/>
  <circle cx="287" cy="192" r="5" fill="#1e222d"/>
  <circle cx="289" cy="190" r="1.8" fill="#ffffff"/>

  <!-- Nose Bridge & Tip -->
  <path d="M256 180 L253 228 L260 234 L252 236" stroke="#b37247" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Stylish Rectangular Glasses (As in reference photos) -->
  <!-- Left Lens Frame -->
  <rect x="202" y="174" width="46" height="36" rx="8" ry="8" fill="rgba(56, 189, 248, 0.08)" stroke="#111827" stroke-width="5.5"/>
  <rect x="204" y="176" width="42" height="32" rx="6" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>
  <!-- Right Lens Frame -->
  <rect x="264" y="174" width="46" height="36" rx="8" ry="8" fill="rgba(56, 189, 248, 0.08)" stroke="#111827" stroke-width="5.5"/>
  <rect x="266" y="176" width="42" height="32" rx="6" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>
  <!-- Center Bridge -->
  <path d="M248 186 Q256 182 264 186" stroke="#111827" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Temples -->
  <line x1="202" y1="184" x2="186" y2="188" stroke="#111827" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="310" y1="184" x2="326" y2="188" stroke="#111827" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Lens Glass Light Reflection Highlight -->
  <path d="M208 180 L228 180 L212 205 L208 205 Z" fill="#ffffff" opacity="0.18"/>
  <path d="M270 180 L290 180 L274 205 L270 205 Z" fill="#ffffff" opacity="0.18"/>

  <!-- Outer Neon Trim Ring Accent -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.3"/>
</svg>
